# Minimal packaging metadata. The pytest block is the load-bearing part: without
# it, a bare `pytest` cannot import `neofold` and dies with 8 collection errors
# on a fresh clone -- which is exactly the command the README tells you to run.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neofold-edge"
version = "0.1.0"
description = "Offline neoantigen triage on an HP ZGX Nano (NVIDIA GB10)"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["neofold"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# No -q here. The README documents `pytest -q`, and an inherited -q makes that
# -qq, which hides the "124 passed" summary line -- so the documented command
# would print a wall of warnings and no verdict.
filterwarnings = [
    "error::UserWarning",
    # FastAPI 0.11x deprecates on_event in favour of lifespan. Ours is one
    # startup hook that warms the model cache; not worth a rewrite mid-hackathon.
    "ignore:(?s).*on_event is deprecated.*:DeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:tensorflow.*",
]
